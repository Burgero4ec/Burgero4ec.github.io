  <meta property="og:type" content="website">

  <!-- ✅ Удален Three.js importmap; оставлен Google Model-Viewer и DOMPurify -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<body>
  <!-- Вместо ToyCar.glb: Интерактивный 3D-глобус Земли -->
  <model-viewer
    id="heroModel"
    src="https://raw.githubusercontent.com/joshhartigan/earth-3d/master/earth.glb"
    alt="3D Глобус Земли Global Lens"
    camera-controls
    auto-rotate
    auto-rotate-delay="500"
    rotation-per-second="18deg"
    shadow-intensity="1.2"
    exposure="1.05"
    camera-orbit="0deg 75deg 105%"
    field-of-view="28deg"
    style="width: 100%; height: 480px;"
  ></model-viewer>
</body>
